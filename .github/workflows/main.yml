
name: Build Islam Sim APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Source ZIP
        run: |
          mkdir -p project

          for file in *.zip; do
            if [ -f "$file" ]; then
              echo "Extracting $file"
              unzip -o "$file" -d project
            fi
          done

      - name: Show Extracted Files
        run: |
          echo "Checking extracted source..."
          find project -maxdepth 4 -type f | head -200

      - name: Locate Gradle Project
        run: |
          ROOT=$(find project -name settings.gradle -o -name settings.gradle.kts | head -n 1)

          if [ -z "$ROOT" ]; then
            ROOT=$(find project -name build.gradle -o -name build.gradle.kts | head -n 1)
          fi

          if [ -z "$ROOT" ]; then
            echo "ERROR: No Gradle project found."
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$ROOT")" >> $GITHUB_ENV

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile Islam Sim
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Islam-Sim-APK
          path: project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
