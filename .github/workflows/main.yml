name: Build Islam Sim APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Islam Sim AdMob IDs (used ONLY by the release build; debug always uses Google test ads)
      ADMOB_APP_ID: ca-app-pub-7220836716577166~6161770892
      ADMOB_REWARDED_ID: ca-app-pub-7220836716577166/9334729143
      # Optional signing secrets (leave unset to get a debug-signed release APK)
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Download Quran Arabic font (Amiri Quran, OFL licence)
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -fL --retry 3 -o app/src/main/assets/fonts/arabic.ttf \
            https://github.com/google/fonts/raw/main/ofl/amiriquran/AmiriQuran-Regular.ttf \
            || echo "Font download failed - app will use the system Arabic font"

      - name: Decode release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No keystore secret - release APK will be debug-signed"
          fi

      - name: Build debug + release APKs
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: Islam-Sim-release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Islam-Sim-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
