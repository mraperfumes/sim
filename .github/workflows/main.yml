
name: Build Islam Sim APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP
        run: |
          mkdir source
          find . -maxdepth 1 -name "*.zip" -print0 | while IFS= read -r -d '' file; do
            unzip -o "$file" -d source
          done

      - name: Find Android Project
        run: |
          find source -name gradlew -type f

          GRADLE=$(find source -name gradlew -type f | head -n 1)

          if [ -z "$GRADLE" ]; then
            echo "No Gradle wrapper found!"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$GRADLE")" >> $GITHUB_ENV

      - name: Compile APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Islam-Sim-APK
          path: source/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
